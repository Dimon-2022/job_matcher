<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Matcher{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'job_list' %}">Job Matcher</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'job_list' %}">Jobs</a>
            {% if user.is_authenticated %}
                {% if user.profile.role == "seeker" %}
                    <a class="btn btn-light btn-sm me-2" href="{% url 'upload_resume' %}">Upload resume</a>
                {% elif user.profile.role == "employer" %}
                    <a class="btn btn-light btn-sm me-2" href="{% url 'my_jobs' %}">My jobs</a>
                    <a class="btn btn-outline-light btn-sm me-2" href="{% url 'job_create' %}">Post a job</a>
                {% endif %}
                <span class="text-light me-2">{{ user.username }}</span>
                <form method="POST" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Login</a>
                <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
