{% extends "base.html" %}

{% block title %}{% block head_title %}{% endblock %}{% endblock %}

{% block extra_head %}
<style>
  main form { max-width: 460px; }

    form input:not([type=checkbox]):not([type=radio]):not([type=hidden]) {
    display: block;
    width: 100%;
    padding: .375rem .75rem;
    margin: .25rem 0 .75rem;
    border: 1px solid var(--bs-border-color);
    border-radius: .375rem;
  }
  main form button[type=submit]:not(.btn) {
    background: var(--bs-primary);
    color: #fff;
    border: 0;
    padding: .45rem 1rem;
    border-radius: .375rem;
  }
</style>
{% endblock %}
