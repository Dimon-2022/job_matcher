{% extends "base.html" %}

{% block title %}Upload resume{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Find jobs that match your resume</h1>
                <p class="text-muted">Upload your CV as a PDF and we'll show the best matching jobs.</p>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.file }}
                        {% for error in form.file.errors %}
                            <div class="text-danger small mt-1">{{ error }}</div>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Find matching jobs</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
