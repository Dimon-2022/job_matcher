{% extends "base.html" %}

{% block title %}My jobs{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">My jobs</h1>
    <a href="{% url 'job_create' %}" class="btn btn-primary">+ Post a job</a>
</div>

{% for job in object_list %}
    <div class="card mb-3 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h2 class="h5 mb-1"><a href="{% url 'job_detail' job.pk %}">{{ job.title }}</a></h2>
                <p class="text-muted mb-0">{{ job.company }} · {{ job.location }}</p>
            </div>
            <div>
                <a href="{% url 'job_update' job.pk %}" class="btn btn-outline-primary btn-sm">Edit</a>
                <a href="{% url 'job_delete' job.pk %}" class="btn btn-outline-danger btn-sm">Delete</a>
            </div>
        </div>
    </div>
{% empty %}
    <div class="alert alert-info">You haven't posted any jobs yet.</div>
{% endfor %}
{% endblock %}
