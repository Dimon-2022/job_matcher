{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}{% if object %}Edit job{% else %}Post a job{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">{% if object %}Edit job{% else %}Post a job{% endif %}</h1>
                <form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'my_jobs' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
